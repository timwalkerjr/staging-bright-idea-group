name: Deploy Bright Idea Group mirror to Static.app

on:
  push:
    branches:
      - main
    paths:
      - src/**
      - public/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - astro.config.mjs
      - netlify.toml
      - scripts/prepare-static-mirror.mjs
      - .github/workflows/deploy-static-app.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: static-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.23.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build site
        run: pnpm build
        env:
          SITE_URL: https://brightideagroup.com

      - name: Prepare Static.app mirror
        run: node scripts/prepare-static-mirror.mjs
        env:
          STATIC_APP_NOINDEX: ${{ vars.STATIC_APP_NOINDEX || 'true' }}

      - name: Deploy to Static.app
        uses: designmodo/static-app-deploy-action@9a67469e5c195ac420e579693149abccb5bd67af # v1.0.0
        with:
          api-key: ${{ secrets.STATIC_APP_API_KEY }}
          pid: 0oibwvg7fy
          build-dir: static-app-dist
